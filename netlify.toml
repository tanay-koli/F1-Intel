[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Forward /api calls to the FastAPI backend on Render (must stay above the SPA rule).
[[redirects]]
  from = "/api/*"
  to = "https://f1-intel.onrender.com/api/:splat"
  status = 200
  force = true

# React Router: serve index.html for every client-side route (/results, /h2h, ...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
