[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "f1_cache", "warehouse/dbt_f1"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "ergast", "telemetry", "race_analyst", "errors", "params", "schemas", "services", "main",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
